{% extends 'base.html' %}
{% block title %}
Reset Password | Nexora
{% endblock %}

{% block content %}
<section
    class="bg-gradient-to-t from-slate-900 to-slate-800 pt-[100px] h-screen flex flex-col items-center justify-center gap-5">
    <h2 class="text-white text-xl md:text-4xl">Forgot Password</h2>
<!-- sm:w-[400px] md:w-[500px] -->
    <div class="w-[200px] sm:w-[350px] p-5 bg-black rounded-md">
        <form method="POST" class="flex flex-col gap-4">
            {% csrf_token %}

            <input type="email" name="email" placeholder="Enter your email" required
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            {% if form.email.errors %}
            <p class="text-red-500 text-sm mt-1">
                {{ form.email.errors.0 }}
            </p>
            {% endif %}

            <button type="submit" class="bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                Send Reset Link
            </button>
        </form>
    </div>
</section>
{% endblock %}
