{% extends 'base.html' %}

{% block title %}
Password Reset Complete | Nexora
{% endblock %}

{% block content %}
<section class="bg-gradient-to-t from-slate-900 to-slate-800 min-h-screen flex items-center justify-center">

    <div class="bg-black p-8 rounded-xl shadow-lg w-[400px] text-center flex flex-col gap-6">
        <div class="flex justify-center">
            <div class="w-16 h-16 flex items-center justify-center rounded-full bg-green-500/20">
                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" stroke-width="3"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M5 13l4 4L19 7"/>
                </svg>
            </div>
        </div>
        <h2 class="text-white text-2xl font-semibold">
            Password Updated
        </h2>
        <p class="text-gray-400 text-sm md:text-lg">
            Your password has been successfully reset. You can now log in using your new credentials.
        </p>
        <a href="/login/"
           class="bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
            Go to Login
        </a>

    </div>

</section>
{% endblock %}
